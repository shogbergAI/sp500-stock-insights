<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>S&P 500 Stock Insights | Market Dashboard</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <style>
    body { font-family: 'Inter', system-ui, sans-serif; }
    .section-header { font-size: 2.25rem; line-height: 1.1; font-weight: 700; }
  </style>
</head>
<body class="bg-slate-950 text-slate-200">

  <!-- Navbar -->
  <nav class="border-b border-slate-800 bg-slate-950 sticky top-0 z-50">
    <div class="max-w-screen-2xl mx-auto px-8 py-5 flex items-center justify-between">
      <div class="flex items-center gap-3">
        <h1 class="text-2xl font-bold tracking-tight">S&P 500 Hub</h1>
      </div>
      
      <!-- Search Bar -->
      <div class="flex-1 max-w-md mx-8">
        <div class="relative">
          <input id="stockSearch" 
                 type="text" 
                 placeholder="Search ticker (e.g. NVDA, AAPL)..." 
                 class="w-full bg-slate-900 border border-slate-700 rounded-3xl py-3 px-5 pl-12 text-sm focus:outline-none focus:border-emerald-500">
          <i class="fas fa-search absolute left-4 top-3.5 text-slate-500"></i>
          <button onclick="performSearch()" 
                  class="absolute right-2 top-1.5 bg-emerald-600 hover:bg-emerald-500 px-6 py-2 rounded-3xl text-sm font-medium">
            Search
          </button>
        </div>
      </div>

      <a href="https://github.com/aztennisfan/sp500-stock-insights" target="_blank" 
         class="text-slate-400 hover:text-white">GitHub</a>
    </div>
  </nav>

  <!-- Hero -->
  <div class="max-w-screen-2xl mx-auto px-8 py-16">
    <div class="text-center">
      <div class="text-emerald-400 text-sm tracking-widest">MAY 29, 2026 • MARKET CLOSED</div>
      <h1 class="text-7xl font-bold tracking-tighter mt-4">S&P 500 Market Hub</h1>
      <p class="max-w-lg mx-auto mt-6 text-xl text-slate-400">Real-time insights, earnings, undervalued picks & momentum plays</p>
    </div>
  </div>

  <!-- Search Results Panel (hidden by default) -->
  <div id="searchResults" class="hidden max-w-2xl mx-auto px-8 mb-12 bg-slate-900 border border-slate-700 rounded-3xl p-8"></div>

  <!-- Upcoming Earnings Calendar -->
  <div class="max-w-screen-2xl mx-auto px-8 py-16 border-t border-slate-800 bg-slate-900">
    <div class="flex items-end justify-between mb-8">
      <div>
        <div class="uppercase tracking-widest text-emerald-400 text-sm">EARNINGS SEASON</div>
        <h2 class="text-4xl font-bold">Upcoming Earnings Calendar</h2>
      </div>
      <input id="calendarFilter" type="text" placeholder="Filter companies..." 
             class="bg-slate-800 border border-slate-700 rounded-3xl px-5 py-3 w-72 focus:outline-none">
    </div>

    <div class="bg-slate-950 border border-slate-800 rounded-3xl overflow-hidden">
      <table class="w-full">
        <thead>
          <tr class="border-b border-slate-800">
            <th class="text-left px-8 py-5">Company</th>
            <th class="text-left px-6 py-5">Ticker</th>
            <th class="text-left px-6 py-5">Date</th>
            <th class="text-right px-6 py-5">Expected EPS</th>
            <th class="text-center px-6 py-5">Time</th>
          </tr>
        </thead>
        <tbody id="earningsBody">
          <!-- Populated by JS -->
        </tbody>
      </table>
    </div>
  </div>

  <script>
    // Sample earnings data
    const earningsData = [
      {company: "Costco Wholesale", ticker: "COST", date: "June 3", eps: "3.82", time: "After Close"},
      {company: "Synopsys", ticker: "SNPS", date: "June 4", eps: "3.15", time: "After Close"},
      {company: "Broadcom", ticker: "AVGO", date: "June 5", eps: "10.85", time: "After Close"},
      {company: "Dell Technologies", ticker: "DELL", date: "June 5", eps: "1.45", time: "After Close"},
      {company: "CrowdStrike", ticker: "CRWD", date: "June 6", eps: "0.92", time: "After Close"}
    ];

    function renderEarnings(filteredData) {
      const tbody = document.getElementById('earningsBody');
      tbody.innerHTML = '';
      filteredData.forEach(item => {
        const row = `<tr class="border-b border-slate-800 hover:bg-slate-900">
          <td class="px-8 py-5 font-medium">${item.company}</td>
          <td class="px-6 py-5 font-mono text-emerald-400">${item.ticker}</td>
          <td class="px-6 py-5">${item.date}</td>
          <td class="px-6 py-5 text-right font-medium">$${item.eps}</td>
          <td class="px-6 py-5 text-center text-xs bg-slate-800 w-28">${item.time}</td>
        </tr>`;
        tbody.innerHTML += row;
      });
    }

    // Initial render
    renderEarnings(earningsData);

    // Filter
    document.getElementById('calendarFilter').addEventListener('input', (e) => {
      const term = e.target.value.toLowerCase();
      const filtered = earningsData.filter(item => 
        item.company.toLowerCase().includes(term) || 
        item.ticker.toLowerCase().includes(term)
      );
      renderEarnings(filtered);
    });

    // Stock Search
    function performSearch() {
      const query = document.getElementById('stockSearch').value.trim().toUpperCase();
      const panel = document.getElementById('searchResults');
      
      if (!query) {
        panel.classList.add('hidden');
        return;
      }

      panel.innerHTML = `
        <div class="flex justify-between items-start">
          <div>
            <h3 class="text-2xl font-semibold">${query} • Search Result</h3>
            <p class="text-slate-400 mt-2">Latest data as of May 29, 2026</p>
          </div>
          <button onclick="document.getElementById('searchResults').classList.add('hidden')" 
                  class="text-slate-400 hover:text-white">✕</button>
        </div>
        <div class="mt-8 grid grid-cols-2 gap-6 text-sm">
          <div>Price: <span class="font-mono text-emerald-400">$XXX.XX</span></div>
          <div>Change: <span class="text-emerald-400">+1.8%</span></div>
          <div>P/E Ratio: 42.3</div>
          <div>Market Cap: $XXXB</div>
        </div>
        <div class="mt-6 text-xs text-slate-500">Mock data — ready for real API integration.</div>
      `;
      panel.classList.remove('hidden');
    }

    // Allow Enter key in search
    document.getElementById('stockSearch').addEventListener('keypress', (e) => {
      if (e.key === 'Enter') performSearch();
    });
  </script>
</body>
</html>
